

# 记忆系统 (高斯衰减)
memory:
  enabled: true
  token_budget: 2500
  decay_per_day: 0.02     # lambda: 越大忘越快, 0.02=约14天归零
  hit_bonus: 5            # 每次命中加分
  base_importance: 10     # 新记忆初始分
  compile_threshold: 4.5  # 低于此分不进 memory.md
  forget_speed: 1.0

# 自学习
experience:
  enabled: true

# 自愈
selfheal:
  enabled: true
  check_interval_ms: 60000
  max_restart_attempts: 3

# 工具
tools:
  enabled: true
# 通道
channels:
  http:
    enabled: true
    port: 8899
  feishu:
    enabled: false
    app_id: ""
    app_secret: ""
    verify_token: ""
  wechat:
    enabled: false
