<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>皮皮虾 · PPX Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #0f1115; color: #e6e6e6; height: 100vh; }
  .app { display: flex; height: 100vh; }
  .chat { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #1f242e; }
  .chat-head { padding: 14px 20px; border-bottom: 1px solid #1f242e; display: flex; align-items: center; gap: 10px; }
  .chat-head h1 { font-size: 16px; font-weight: 600; }
  .badge { font-size: 11px; background: #1d2a3a; color: #4da3ff; padding: 2px 8px; border-radius: 10px; }
  #msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 10px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #1d5cff; color: #fff; }
  .msg.agent { align-self: flex-start; background: #1f242e; border: 1px solid #2a3140; }
  .msg.agent pre { background: #0d0f13; border: 1px solid #2a3140; border-radius: 6px; padding: 10px; overflow-x: auto; margin: 8px 0; }
  .msg.agent code { background: #0d0f13; padding: 1px 5px; border-radius: 4px; font-family: Consolas, monospace; font-size: 12.5px; }
  .msg.agent pre code { padding: 0; background: none; }
  .msg.agent p { margin: 6px 0; }
  .msg.agent ul, .msg.agent ol { margin: 6px 0 6px 20px; }
  .msg.agent a { color: #4da3ff; }
  .msg.err { background: #3a1d1d; border: 1px solid #5c2a2a; }
  .input-bar { padding: 14px; border-top: 1px solid #1f242e; display: flex; gap: 10px; }
  .input-bar input { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #2a3140; background: #1a1e26; color: #e6e6e6; font-size: 14px; outline: none; }
  .input-bar input:focus { border-color: #1d5cff; }
  .input-bar button { padding: 12px 22px; border-radius: 8px; border: none; background: #1d5cff; color: #fff; font-size: 14px; cursor: pointer; }
  .input-bar button:disabled { opacity: .5; cursor: not-allowed; }
  .side { width: 360px; display: flex; flex-direction: column; }
  .tabs { display: flex; border-bottom: 1px solid #1f242e; }
  .tab { flex: 1; padding: 12px; text-align: center; font-size: 13px; cursor: pointer; color: #888; border-bottom: 2px solid transparent; }
  .tab.active { color: #4da3ff; border-bottom-color: #4da3ff; }
  .panel { flex: 1; overflow-y: auto; padding: 16px; display: none; }
  .panel.active { display: block; }
  .card { background: #1a1e26; border: 1px solid #2a3140; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .card .t { font-size: 12px; color: #888; margin-bottom: 4px; }
  .card .c { font-size: 13px; line-height: 1.5; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 8px; margin-left: 6px; }
  .pill.ok { background: #0f3d24; color: #3ddc84; }
  .pill.bad { background: #3d1d1d; color: #ff6b6b; }
  .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1f242e; font-size: 13px; }
  .stat-row .v { color: #4da3ff; font-weight: 600; }
  .empty { color: #666; font-size: 13px; text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<div class="app">
  <div class="chat">
    <div class="chat-head">
      <h1>皮皮虾</h1><span class="badge">PPX Agent</span><button onclick="resetSession()" style="margin-left:auto;padding:6px 12px;border-radius:8px;border:1px solid #2a3140;background:#1a1e26;color:#888;cursor:pointer;font-size:12px;white-space:nowrap">清空会话</button>
    </div>
    <div id="msgs"><div class="empty">和皮皮虾聊聊吧</div></div>
    <div class="input-bar">
      <input id="inp" placeholder="输入消息，Enter 发送" autofocus>
      <button id="btn">发送</button>
    </div>
  </div>
  <div class="side">
    <div class="tabs">
      <div class="tab active" data-t="memory">记忆</div>
      <div class="tab" data-t="traces">轨迹</div>
      <div class="tab" data-t="stats">统计</div>
    </div>
    <div id="panel-memory" class="panel active"></div>
    <div id="panel-traces" class="panel"></div>
    <div id="panel-stats" class="panel"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const msgs=document.getElementById("msgs"), inp=document.getElementById("inp"), btn=document.getElementById("btn");
let sessionId = localStorage.getItem("ppx_sid") || ("s_" + Math.random().toString(36).slice(2,10));
localStorage.setItem("ppx_sid", sessionId);
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function renderMd(t){ try{ return marked.parse(String(t||"")); }catch(e){ return esc(t); } }
function addMsg(role, text, isMd){
  msgs.querySelector(".empty")?.remove();
  const d=document.createElement("div"); d.className="msg "+role;
  if(role==="agent" && isMd){ d.innerHTML=renderMd(text); }
  else { d.textContent=text; }
  msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
  return d;
}
// 流式对话: fetch + 读 SSE
async function send(){
  const t=inp.value.trim(); if(!t) return;
  addMsg("user", t); inp.value=""; btn.disabled=true;
  const agentEl=addMsg("agent", "…", false);
  let full="";
  try{
    const r=await fetch("/message/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t, sessionId})});
    if(!r.ok || !r.body){ const j=await r.json().catch(()=>null); addMsg("err", j?.error || "请求失败"+(r.status===401?" (未授权)":"")); btn.disabled=false; return; }
    const reader=r.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf("\n\n"))!==-1){
        const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        for(const line of chunk.split("\n")){
          if(!line.startsWith("data:")) continue;
          try{
            const j=JSON.parse(line.slice(5).trim());
            if(j.type==="delta"){ full+=j.content; agentEl.innerHTML=renderMd(full); msgs.scrollTop=msgs.scrollHeight; }
            else if(j.type==="done"){ full=j.content; agentEl.innerHTML=renderMd(full); msgs.scrollTop=msgs.scrollHeight; }
            else if(j.type==="error"){ addMsg("err", j.error); }
          }catch{}
        }
      }
    }
  }catch(e){ addMsg("err", "请求失败: "+e.message); }
  btn.disabled=false;
}
function resetSession(){
  if(!confirm("清空当前会话历史?")) return;
  sessionId="s_"+Math.random().toString(36).slice(2,10); localStorage.setItem("ppx_sid", sessionId);
  fetch("/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId})});
  msgs.innerHTML='<div class="empty">新会话已开始</div>';
}
btn.onclick=send; inp.onkeydown=e=>{ if(e.key==="Enter") send(); };

// Tabs
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  document.getElementById("panel-"+t.dataset.t).classList.add("active");
  load(t.dataset.t);
});

async function load(which){
  const el=document.getElementById("panel-"+which);
  if(which==="memory") el.innerHTML="<div class=empty>加载中…</div>";
  try{
    if(which==="memory"){
      const r=await fetch("/api/memory"); const j=await r.json();
      // 场景区 (含新建)
      el.innerHTML='<button onclick="newScene()" style="width:100%;padding:9px;margin-bottom:10px;border-radius:8px;border:1px solid #2a3140;background:#1d5cff;color:#fff;cursor:pointer;font-size:13px">+ 新建场景</button>';
      el.innerHTML+=`<div class=card><div class=t>场景 (${(j.scenes||[]).length})</div>`+
        (j.scenes||[]).map(s=>`<div class=card style=margin:8px 0><div style="font-size:13px;font-weight:600">${esc(s.name)} <span class="pill ${s.mode==="manual"?"ok":"bad"}">${s.mode==="manual"?"自定义":"自动"}</span></div>`+
          `<div class=c style=margin-top:4px>${esc(s.description||"")}</div>`+
          `<div class=c style="margin-top:4px;color:#4da3ff">能帮: ${esc(s.canHelp||"")}</div>`+
          `<div class=t style=margin-top:4px>${s.facts}条记忆 · 更新 ${esc(s.lastUpdated||"")}</div></div>`).join("")+'</div>';
      // 事实区
      el.innerHTML+="<div class=card><div class=t>关键事实</div>"+(j.facts||[]).map(f=>`<div class=c>${esc(f.content)}</div>`).join("")||"<div class=empty>暂无事实</div>";
    }else if(which==="traces"){
      const r=await fetch("/api/traces?limit=50"); const j=await r.json();
      el.innerHTML=(j.length?j.map(t=>`<div class=card><div class=t>${esc(t.tool)} <span class=pill ${t.ok?"ok":"bad"}>${t.ok?"OK":"FAIL"}</span> ${t.durationMs}ms</div><div class=c>${esc(t.args).slice(0,120)}</div></div>`).join(""):'<div class=empty>暂无轨迹</div>');
    }else if(which==="stats"){
      const r=await fetch("/api/stats"); const j=await r.json();
      el.innerHTML=`<div class=card><div class=c>调用 ${j.count} 次 · 失败 ${j.failed} (<span class=pill ${Number(j.failRate)>10?"bad":"ok"}>${esc(j.failRate)}</span>)</div></div>`+
        "<div class=card><div class=t>慢工具 Top</div>"+(j.slowTools||[]).map(s=>`<div class=stat-row><span>${esc(s.tool)}</span><span class=v>${s.avgMs}ms</span></div>`).join("")+'</div>';
    }
  }catch(e){ el.innerHTML='<div class=empty>加载失败: '+esc(e.message)+'</div>'; }
}
function newScene(){
  const n=prompt("场景名称 (如: A股交易助手)"), d=prompt("场景介绍 (这个场景是干嘛的)"), h=prompt("能帮用户干什么 (能力清单)");
  if(n&&d&&h){ fetch("/message",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:`用 scene_create 创建场景: 名称=${n}, 介绍=${d}, 能帮=${h}`})}).then(r=>r.json()).then(()=>load("memory")).catch(()=>{}); }
}
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
load("memory");
</script>
</body>
</html>
