# 皮皮虾 CI/CD — 每次 push / PR 自动跑全量测试 + 前端类型检查 + 本地能力评测
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 内核: 全量测试 (零依赖, 网络型测试默认跳过)
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # 内核零运行时依赖, 无需 npm install
      - name: 全量测试
        run: npm test
        timeout-minutes: 15

  # Web UI: 类型检查 + 生产构建
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装 web 依赖
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: 类型检查
        working-directory: web
        run: npx tsc --noEmit
      - name: 生产构建
        working-directory: web
        run: npm run build
        timeout-minutes: 10

  # 能力评测: 本地能力必跑; 配了 PPX_E2E_* secrets 时额外跑 LLM 端到端回归
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 本地能力评测
        run: node scripts/eval.js
        timeout-minutes: 5
      - name: LLM 端到端回归 (配置了 secrets 时)
        if: ${{ secrets.PPX_E2E_BASE_URL != '' }}
        env:
          PPX_E2E_BASE_URL: ${{ secrets.PPX_E2E_BASE_URL }}
          PPX_E2E_API_KEY: ${{ secrets.PPX_E2E_API_KEY }}
          PPX_E2E_MODEL: ${{ secrets.PPX_E2E_MODEL }}
        run: node scripts/eval.js --llm
        timeout-minutes: 10
